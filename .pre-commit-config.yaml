# Pre-commit hooks configuration
# Instalar: pre-commit install
# Ejecutar manualmente: pre-commit run --all-files

repos:
  # Hooks generales
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Black - Formateo de código
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        args: ['--line-length=88']
        files: ^(api|tests)/.*\.py$

  # Flake8 - Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args: ['--max-line-length=88', '--extend-ignore=E203,W503']
        files: ^(api|tests)/.*\.py$

  # MyPy - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-redis==4.6.0.20241004
          - types-requests==2.33.0.20261006
          - pydantic==2.14.1
          - pydantic-settings==2.16.1
          - fastapi==0.153.0
          - httpx==0.28.1
        args: ['--python-version=3.11', '--config-file=pyproject.toml']
        files: ^api/.*\.py$
        exclude: ^tests/

  # Pytest - Tests rápidos (solo si hay cambios en tests/)
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        # entry portable: corre en Windows (sin bash) y en Linux/macOS.
        # sys.exit(0) conserva el comportamiento no bloqueante del bash -c original.
        entry: python -c "import subprocess, sys; subprocess.call([sys.executable, '-m', 'pytest', 'tests/', '-v', '--tb=short', '-x']); sys.exit(0)"
        language: system
        pass_filenames: false
        always_run: false
        files: ^(api|tests)/.*\.py$
        stages: [manual]
